<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basic Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator">
    <input type="text" class="display" id="display" disabled />
    <div class="buttons">

          <!-- New feature buttons (first row) -->
      <!-- <button onclick="squareRoot()">√</button>
      <button onclick="percentage()">%</button> -->
      <button onclick="memoryAdd()">M+</button>
      <button onclick="memorySubtract()">M-</button>

      <!-- Second row (memory recall/clear) -->
      <button onclick="memoryRecall()">MR</button>
      <button onclick="memoryClear()">MC</button>

      <button onclick="clearDisplay()" class="caractor">C</button>
      <button onclick="appendToDisplay('/')" class="caractor">/</button>
      <button onclick="appendToDisplay('*')" class="caractor">*</button>
      <button onclick="backspace()" class="caractor">⌫</button>

      <button onclick="appendToDisplay('7')">7</button>
      <button onclick="appendToDisplay('8')">8</button>
      <button onclick="appendToDisplay('9')">9</button>
      <button onclick="appendToDisplay('-')" class="caractor">-</button>

      <button onclick="appendToDisplay('4')">4</button>
      <button onclick="appendToDisplay('5')">5</button>
      <button onclick="appendToDisplay('6')">6</button>
      <button onclick="appendToDisplay('+')" class="caractor">+</button>

      <button onclick="appendToDisplay('1')">1</button>
      <button onclick="appendToDisplay('2')">2</button>
      <button onclick="appendToDisplay('3')">3</button>
      <button onclick="calculate()" class="equl">=</button>

      <!-- <button onclick="appendToDisplay('0')" class="zero">0</button> -->
      <button onclick="appendToDisplay('0')">0</button>
      <button onclick="appendToDisplay('.')">.</button>
      <button onclick="squareRoot()" class="caractor">√</button>
      <button onclick="percentage()" class="caractor">%</button>

    

    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
